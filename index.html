<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Guide — Solo Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12161d;
    --panel: #181e27;
    --panel-2: #1f2631;
    --border: #262e3b;
    --text: #e8ebf1;
    --text-muted: #8b93a5;
    --text-faint: #5b6474;
    --ct: #5b9bdb;
    --ct-dim: #3a5a7a;
    --t: #dd9a4e;
    --t-dim: #7a5c37;
    --bal: #8892a3;
    --util: #8892a3;
    --insight: #4bbf93;
    --insight-bg: rgba(75,191,147,0.08);
    --smoke: #9fb4cf;
    --fire: #e2703f;
    --radius: 3px;
  }

  * { box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3, .display{
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0;
  }
  button{ font-family: inherit; }
  code{
    font-family: 'Consolas', 'Menlo', monospace;
    background: var(--panel-2);
    padding: 1px 6px;
    border-radius: 2px;
    font-size: 12.5px;
    color: var(--insight);
  }
  ::selection{ background: var(--ct-dim); color: #fff; }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }

  a:focus-visible, button:focus-visible{
    outline: 2px solid var(--insight);
    outline-offset: 2px;
  }

  .app{ display: flex; min-height: 100vh; }

  /* ---------------- SIDEBAR ---------------- */
  .sidebar{
    width: 252px; flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 22px 0 16px;
  }
  .brand{ padding: 0 20px 18px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
  .brand .display{ font-size: 21px; color: var(--text); }
  .brand .sub{ font-size: 12px; color: var(--text-muted); margin-top: 3px; }

  .navgroup-label{ font-size: 11px; color: var(--text-faint); padding: 16px 20px 6px; }

  nav{ display:flex; flex-direction:column; }
  .navitem{
    display:flex; align-items:center; gap: 11px; width:100%;
    background:none; border:none; color: var(--text-muted);
    text-align:left; padding: 8px 20px; cursor:pointer;
    border-left: 2px solid transparent; font-size: 14.5px;
  }
  .navitem:hover{ background: var(--panel-2); color: var(--text); }
  .navitem.active{ background: var(--panel-2); color: var(--text); border-left-color: var(--active-color, var(--insight)); }
  .navitem svg{ width:18px; height:18px; flex-shrink:0; color: var(--icon-color, var(--text-faint)); }
  .navitem.active svg{ color: var(--active-color, var(--insight)); }
  .navitem .lean-dot{ margin-left:auto; width:7px; height:7px; border-radius:50%; background: var(--dot-color, var(--bal)); }

  .sidebar-foot{ margin-top:auto; padding: 14px 20px 0; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-faint); line-height:1.5; }

  /* ---------------- MAIN ---------------- */
  .main{ flex:1; padding: 40px 48px 64px; max-width: 920px; }

  .page-head{ margin-bottom: 28px; }
  .page-head .display{ font-size: 34px; }
  .page-head .desc{ color: var(--text-muted); font-size: 14.5px; margin-top: 6px; max-width: 64ch; }
  .patch-tag{
    display:inline-block; font-size: 11.5px; color: var(--insight);
    background: var(--insight-bg); border: 1px solid rgba(75,191,147,0.25);
    padding: 3px 9px; border-radius: var(--radius); margin-top: 12px;
  }

  .tile-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 22px; }
  .tile{
    background: var(--panel); border: 1px solid var(--border);
    border-left: 3px solid var(--lean-color, var(--bal));
    padding: 16px 16px 14px; text-align:left; cursor:pointer; color: var(--text);
    display:flex; flex-direction:column; gap:10px;
  }
  .tile:hover{ background: var(--panel-2); }
  .tile-top{ display:flex; align-items:center; gap:10px; }
  .tile-top svg{ width:26px; height:26px; color: var(--lean-color, var(--bal)); flex-shrink:0; }
  .tile-top .name{ font-family:'Rajdhani',sans-serif; font-weight:600; font-size:18px; }
  .balance-bar{ height:5px; width:100%; background: var(--panel-2); border-radius: 3px; overflow:hidden; display:flex; }
  .balance-bar .ct-seg{ background: var(--ct); height:100%; }
  .balance-bar .t-seg{ background: var(--t); height:100%; }
  .balance-label{ font-size: 11.5px; color: var(--text-faint); }
  .tile-note{ font-size: 13px; color: var(--text-muted); line-height:1.5; }

  .map-head{ display:flex; align-items:center; gap:16px; margin-bottom: 6px; }
  .map-head svg{ width:44px; height:44px; color: var(--lean-color); }
  .map-head .display{ font-size: 32px; }
  .map-balance-row{ display:flex; align-items:center; gap:12px; margin: 14px 0 26px; }
  .map-balance-row .balance-bar{ max-width: 260px; }
  .map-balance-row .balance-label{ font-size:13px; color: var(--text-muted); }

  .side-toggle{ display:inline-flex; border:1px solid var(--border); border-radius: var(--radius); overflow:hidden; margin-bottom: 26px; }
  .side-toggle button{
    border:none; background: var(--panel); color: var(--text-muted);
    padding: 9px 20px; font-size: 14px; font-weight:600; cursor:pointer;
    font-family:'Rajdhani',sans-serif; letter-spacing: 0.03em;
    border-right: 1px solid var(--border);
  }
  .side-toggle button:last-child{ border-right:none; }
  .side-toggle button.active[data-side="t"]{ background: var(--t); color:#1a1206; }
  .side-toggle button.active[data-side="ct"]{ background: var(--ct); color:#0d1b2a; }
  .side-toggle button.active[data-side="util"]{ background: var(--util); color:#12161d; }

  .info-stack{ display:flex; flex-direction:column; }
  .info-row{ padding: 16px 0; border-top: 1px solid var(--border); }
  .info-row:last-of-type{ border-bottom: 1px solid var(--border); }
  .info-row .label{ font-size: 13px; color: var(--text-faint); margin-bottom: 5px; }
  .info-row .body{ font-size: 15px; color: var(--text); max-width: 68ch; }

  .reminder{ margin-top: 22px; border-left: 3px solid var(--insight); background: var(--insight-bg); padding: 16px 18px; }
  .reminder .label{ font-size: 12.5px; color: var(--insight); margin-bottom: 6px; font-weight: 600; }
  .reminder .body{ font-size: 14.5px; color: var(--text); max-width: 66ch; }

  .util-intro{ font-size: 13.5px; color: var(--text-muted); margin-bottom: 18px; max-width: 64ch; }
  .util-card{ display:flex; gap:18px; padding: 18px 0; border-top: 1px solid var(--border); }
  .util-card:first-of-type{ border-top:none; }
  .util-diagram{ flex-shrink:0; width:88px; height:60px; }
  .util-head{ display:flex; align-items:center; gap:10px; margin-bottom:5px; flex-wrap:wrap; }
  .util-name{ font-family:'Rajdhani',sans-serif; font-weight:600; font-size:16.5px; }
  .util-stance{ font-size: 10.5px; text-transform: none; padding:2px 8px; border:1px solid var(--border); border-radius:20px; color: var(--text-muted); }
  .util-line{ font-size: 13.5px; color: var(--text-muted); margin-top: 3px; max-width: 60ch; }
  .util-line b{ color: var(--text); font-weight: 500; }
  .util-effect{ font-size: 13.5px; color: var(--insight); margin-top: 8px; max-width: 60ch; }

  .tilt-group{ margin-bottom: 30px; }
  .tilt-group h2{
    font-size: 15px; color: var(--text-faint); font-weight: 500; font-family: 'Inter', sans-serif;
    margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .protocol-item{ display: grid; grid-template-columns: minmax(180px, 240px) 1fr; gap: 18px; padding: 14px 0; border-top: 1px solid var(--border); }
  .tilt-group .protocol-item:first-of-type{ border-top:none; }
  .protocol-item .situ{ font-size: 14px; color: var(--text-muted); }
  .protocol-item .do{ font-size: 15px; color: var(--text); margin-bottom:4px; }
  .protocol-item .why{ font-size: 13px; color: var(--text-faint); }

  .reality-check{ margin-top: 6px; border-left: 3px solid var(--insight); background: var(--insight-bg); padding: 16px 18px; font-size: 14px; color: var(--text); max-width: 70ch; }

  @media (max-width: 760px){
    .app{ flex-direction: column; }
    .sidebar{ width: 100%; flex-direction: row; align-items:center; padding: 12px 0; overflow-x: auto; border-right:none; border-bottom: 1px solid var(--border); }
    .brand{ display:none; }
    .navgroup-label{ display:none; }
    nav{ flex-direction:row; }
    .navitem{ flex-shrink:0; border-left:none; border-bottom: 2px solid transparent; padding: 8px 14px; white-space: nowrap; }
    .navitem.active{ border-bottom-color: var(--active-color, var(--insight)); }
    .navitem .lean-dot{ margin-left:6px; }
    .sidebar-foot{ display:none; }
    .main{ padding: 26px 20px 48px; }
    .page-head .display{ font-size: 26px; }
    .protocol-item{ grid-template-columns: 1fr; gap:4px; }
    .util-card{ flex-direction:column; gap:10px; }
    .util-diagram{ width:72px; height:48px; }
  }
</style>
</head>

<script>
function cloudIcon(x,y,color){
  return `<g fill="${color||'var(--smoke)'}" opacity="0.92">
    <circle cx="${x-6}" cy="${y}" r="6"/><circle cx="${x+6}" cy="${y}" r="6"/><circle cx="${x}" cy="${y-5}" r="7"/>
  </g>`;
}
function flameIcon(x,y,color){
  return `<path d="M${x} ${y-11} C ${x-6} ${y-3} ${x-8} ${y+5} ${x} ${y+9} C ${x+8} ${y+5} ${x+6} ${y-3} ${x} ${y-11} Z" fill="${color||'var(--fire)'}" opacity="0.92"/>`;
}
function utilDiagram(type){
  const icon = type === 'molotov' ? flameIcon(72,26) : cloudIcon(72,26);
  return `<svg class="util-diagram" viewBox="0 0 88 56">
    <path d="M10 46 Q 44 6 68 22" fill="none" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="10" cy="46" r="4" fill="var(--insight)"/>
    ${icon}
  </svg>`;
}

      { name:'CT smoke', type:'smoke', stance:'Jump-throw', position:'Right corner of the double-door entrance near Tunnels.', aim:'The top-right brick edge of the arch above the exit.', effect:'Cuts the CT spawn sightline into A during the execute, so your entry isn\'t contested the instant you round the corner.' }

const TILT_GROUPS = [
  { title: 'Before you queue', items: [
    { situ:'Starting a session', do:'Warm up first, and pick ONE concrete focus for the session (e.g. "crosshair placement" or "trading faster") — not "hit Level 10."', why:'A rank is an outcome you don\'t fully control in solo queue. A skill focus gives you a real progress signal every game, win or lose.' }
  ]},
  { title: 'During the match', items: [
    { situ:'You feel the urge to type something angry, or force a bad fight', do:'Lean back. Box-breathe: inhale 4 seconds, hold 4, exhale 6. Twice, before your next action.', why:'This is a physiological reset, not a mood trick — frustration spikes cortisol, which measurably narrows attention and slows decisions.' },
    { situ:'Right after you\'ve reset', do:'Ask one question: "what maximizes THIS round\'s win chance?" Not the map, not the match — this round.', why:'It shrinks focus back to something you actually control instead of the scoreline or a teammate\'s last mistake.' },
    { situ:'2 losses in a row and it\'s building', do:'Take a real break — 20-30 minutes, not 60 seconds. Don\'t requeue immediately "to fix it."', why:'Continuing while tilted is negative EV even against weaker opponents — your aim and calls are already worse than your rank.' },
    { situ:'A teammate turns toxic or starts int-ing', do:'Mute them immediately. Don\'t engage, don\'t explain yourself.', why:'Arguing in chat burns the exact same attention budget you need for crosshair placement and calls.' }
  ]},
  { title: 'After a loss or session', items: [
    { situ:'Reviewing what happened', do:'Look at 2-3 of your own deaths, not the scoreboard. Ask what you could have done differently, not what your team did wrong.', why:'This is literally how players close the gap between ranks — auditing their own decisions, not their teammates\'.' }
  ]}
];

const COACH_GROUPS = [
  { title:'Set up before you grind', items:[
    { situ:'Jump-throw consistency', do:'Bind a single key to jump-and-release together, e.g. console: <code>alias "+jt" "+jump;-attack;-attack2"; alias "-jt" "-jump"; bind "alt" "+jt"</code>. Most of the lineups in this guide need it.', why:'A lineup you can\'t land under pressure isn\'t worth the utility slot — the bind is what makes the release frame consistent.' },
    { situ:'Learning a new lineup', do:'Load an offline server with <code>sv_cheats 1</code> and turn on grenade trajectories so you can see exactly where each throw lands. Repeat until it\'s muscle memory — about 15 minutes is enough for 3-4 lineups.', why:'Watching the trajectory line removes the guesswork that makes lineups feel inconsistent in a live match.' }
  ]},
  { title:'How real coaches find your leaks', items:[
    { situ:'Reviewing your own play', do:'Pull one demo — ideally a close loss — and watch it like a coach would: spacing, audio discipline, and who\'s still alive during the round you lost. Fix ONE recurring pattern, not everything at once.', why:'A single demo shows most of what\'s wrong in under ten rounds. Coaches don\'t chase every mistake — they chase the one that repeats.' },
    { situ:'Judging whether you\'re improving', do:'Evaluate any change over a window of about 10 matches, not one evening. A single bad session tells you nothing about whether a fix is working.', why:'Rank and performance both have enough variance session-to-session that one game is noise, not signal.' }
  ]},
  { title:'The under-coached skill', items:[
    { situ:'Every round\'s buy decision', do:'Protect your own economy even with zero comms: don\'t force when it\'s obvious the team is saving (3+ teammates with pistols out), and don\'t full-eco alone when everyone else clearly bought.', why:'Economy discipline is repeatedly flagged as the highest-impact, least-coached skill in CS2 — bad buys lose rounds before they even start, and solo queue punishes it hardest since no one calls it for you.' }
  ]},
  { title:'Rule out the wrong problem', items:[
    { situ:'"I\'m playing worse than I feel I should"', do:'Before assuming it\'s a skill or decision-making issue, rule out hardware — frametime spikes and input lag can look exactly like a form dip. Then separate tilt (see Anti-Tilt) from an actual mechanical gap.', why:'Coaches treat this as a specific diagnostic question, not a mood check — fixing the wrong one wastes weeks.' }
  ]}
];

const state = { section: 'overview' };

function leanColor(lean){ return lean === 'ct' ? 'var(--ct)' : lean === 't' ? 'var(--t)' : 'var(--bal)'; }

function buildNav(){
  document.getElementById('nav-top').innerHTML = navButton('overview', 'icon-overview', 'Overview');
  document.getElementById('nav-maps').innerHTML = MAPS.map(m => navButton(m.id, m.icon, m.name, leanColor(m.lean))).join('');
  document.getElementById('nav-coach').innerHTML =
    navButton('tilt', 'icon-tilt', 'Anti-Tilt') + navButton('coach', 'icon-coach', "Coach's Notebook");

  document.querySelectorAll('.navitem').forEach(btn=>{
    btn.addEventListener('click', ()=> selectSection(btn.dataset.id));
  });
}

function navButton(id, icon, label, dotColor){
  return `<button class="navitem" data-id="${id}" style="--active-color:${dotColor||'var(--insight)'}; --icon-color:${dotColor||'var(--text-faint)'}">
    <svg><use href="#${icon}"/></svg>
    <span>${label}</span>
    ${dotColor ? `<span class="lean-dot" style="--dot-color:${dotColor}"></span>` : ''}
  </button>`;
}

function selectSection(id){
  state.section = id;
  state.side = 'ct';
  document.querySelectorAll('.navitem').forEach(b=> b.classList.toggle('active', b.dataset.id === id));
  render();
}

function balanceBar(ctPct){
  return `<div class="balance-bar"><div class="ct-seg" style="width:${ctPct}%"></div><div class="t-seg" style="width:${100-ctPct}%"></div></div>`;
}

function render(){
  const main = document.getElementById('main');
  if(state.section === 'overview') return renderOverview(main);
  if(state.section === 'tilt') return renderTilt(main);
  if(state.section === 'coach') return renderCoach(main);
  const map = MAPS.find(m=>m.id===state.section);
  if(map) return renderMap(main, map);
}

function renderOverview(main){
  main.innerHTML = `
    <div class="page-head">
      <h1 class="display">Overview</h1>
      <p class="desc">Solo queue reference — assumes zero reliable comms from teammates. Pick a map before you load in.</p>
      <span class="patch-tag">Season 5 &middot; Cache replaced Overpass, Jul 6 2026</span>
    </div>
    <div class="tile-grid">
      ${MAPS.map(m => `
        <button class="tile" style="--lean-color:${leanColor(m.lean)}" data-id="${m.id}">
          <div class="tile-top"><svg><use href="#${m.icon}"/></svg><span class="name">${m.name}</span></div>
          ${balanceBar(m.ctPct)}
          <div class="balance-label">${m.balanceLabel}</div>
          <div class="tile-note">${m.oneLiner}</div>
        </button>
      `).join('')}
    </div>
  `;
  main.querySelectorAll('.tile').forEach(t=> t.addEventListener('click', ()=> selectSection(t.dataset.id)));
}

function renderMap(main, map){
  const side = state.side || 'ct';

  let bodyHtml;
  if(side === 'util'){
    bodyHtml = `
      <p class="util-intro">The 3 highest-impact lineups on this map — learn these before expanding your kit. Diagrams show stance &rarr; aim &rarr; landing spot; verify the exact pixel in an offline server with grenade trajectories on (see Coach's Notebook).</p>
      ${map.utility.map(u => `
        <div class="util-card">
          ${utilDiagram(u.type)}
          <div class="util-body">
            <div class="util-head"><span class="util-name">${u.name}</span><span class="util-stance">${u.stance}</span></div>
            <div class="util-line"><b>Position:</b> ${u.position}</div>
            <div class="util-line"><b>Aim:</b> ${u.aim}</div>
            <div class="util-effect">${u.effect}</div>
          </div>
        </div>
      `).join('')}
    `;
  } else {
    const d = map[side];
    const rows = side === 't'
      ? [['#1 priority', d.priority], ['What the lobby usually does — attach to it', d.lobby], ['How you create value alone', d.value], ['Self-sufficient utility (no setup needed)', d.utility]]
      : [['#1 priority', d.priority], ['Where to hold — works with zero backup', d.hold], ['Rotating without comms', d.rotate], ['Self-sufficient utility (no setup needed)', d.utility]];
    bodyHtml = `
      <div class="info-stack">
        ${rows.map(([label,body])=>`<div class="info-row"><div class="label">${label}</div><div class="body">${body}</div></div>`).join('')}
      </div>
      <div class="reminder"><div class="label">Why this matters at your level</div><div class="body">${d.reminder}</div></div>
    `;
  }

  main.innerHTML = `
    <div class="map-head">
      <svg style="--lean-color:${leanColor(map.lean)}"><use href="#${map.icon}"/></svg>
      <h1 class="display">${map.name}</h1>
    </div>
    <div class="map-balance-row">${balanceBar(map.ctPct)}<span class="balance-label">${map.balanceLabel}</span></div>
    <div class="side-toggle">
      <button data-side="t" class="${side==='t'?'active':''}">T side</button>
      <button data-side="ct" class="${side==='ct'?'active':''}">CT side</button>
      <button data-side="util" class="${side==='util'?'active':''}">Utility</button>
    </div>
    ${bodyHtml}
  `;
  main.querySelectorAll('.side-toggle button').forEach(b=>{
    b.addEventListener('click', ()=>{ state.side = b.dataset.side; renderMap(main, map); });
  });
}

function renderGroupedList(main, title, desc, groups){
  main.innerHTML = `
    <div class="page-head"><h1 class="display">${title}</h1><p class="desc">${desc}</p></div>
    ${groups.map(g => `
      <div class="tilt-group">
        <h2>${g.title}</h2>
        ${g.items.map(it => `
          <div class="protocol-item">
            <div class="situ">${it.situ}</div>
            <div><div class="do">${it.do}</div><div class="why">${it.why}</div></div>
          </div>
        `).join('')}
      </div>
    `).join('')}
  `;
}

function renderTilt(main){
  renderGroupedList(main, 'Anti-Tilt Protocol',
    "Read this before you queue, not mid-tilt. Frustration at teammates is the most common stressor at this level — this is how you keep it from costing you the session.",
    TILT_GROUPS);
  main.insertAdjacentHTML('beforeend', `
    <div class="reality-check">
      Research on competitive shooter players splits in-game stress roughly evenly between individual and team-related causes. This isn't a sign you're doing something wrong — it's the normal cost of solo queue. The players who keep climbing aren't the ones who never get frustrated; they're the ones who have a reset habit.
    </div>
  `);
}

function renderCoach(main){
  renderGroupedList(main, "Coach's Notebook",
    "How players actually get coached above Level 7 — the process, not just the lineups.",
    COACH_GROUPS);
}

buildNav();
selectSection('overview');
</script>
</body>
</html>
